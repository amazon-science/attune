# Layer-1 argument classes of the correctness check (layer1.py), over the resolved arguments of one Megatron-LM +
# slime build, extended with the arguments of miles v0.1.0 (78527b91) and its DeepSeek-V4 model, and of miles bfdcff0e
# (Muse Spark, PR #4111) with Megatron-LM 6530834a ("# uncertain": numeric until a component test). A resolved argument
# that differs between baseline and candidate FAILS layer 1 if its class is objective: the data, sampling, batch, run
# length, learning-rate and weight-decay schedule, optimizer and trained parameters, loss terms, dropout, precision
# format, token dropping and routing semantics that define what is trained.
# A numeric change, and a change of a name this list does not know (a new image), is unknown: it passes layer 1, the
# step-0 check judges it, and the verdict lists it for human review. Class every name of a new image's dump (README.md).
# derived: recomputed by layer 1 from the accepted arguments it is derived from (layer1.derived_ok);
#   it may move only as a consequence of those, and an arbitrary override is refused.
